name: Update MQL5 stats
on:
  schedule:
    - cron: "31 2,14 * * *"   # about 8:01 AM and 8:01 PM India time
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 update_stats.py
      - name: Save new numbers
        run: |
          if [ -n "$(git status --porcelain stats.json)" ]; then
            git config user.name "cml-stats-bot"
            git config user.email "actions@users.noreply.github.com"
            git add stats.json
            git commit -m "Update MQL5 stats"
            git push
          fi
