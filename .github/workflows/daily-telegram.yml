name: Daily Telegram post
on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 min; run_slot.py decides what is due (9 AM view, 6 PM education)
  workflow_dispatch:
    inputs:
      mode:
        description: "auto = same as timer, view-live / edu-live = send now, view-dry / edu-dry = test only"
        type: choice
        default: view-dry
        options: [view-dry, view-live, edu-dry, edu-live, auto]
permissions:
  contents: write
concurrency:
  group: daily-telegram
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Send today's post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "@Goldtraderchamp"
          START_DATE: "2026-11-02"
          RUN_MODE: ${{ github.event.inputs.mode }}
        run: |
          pip install -q matplotlib
          git config user.name "cml-stats-bot"
          git config user.email "actions@users.noreply.github.com"
          remember() {
            if [ -n "$(git status --porcelain posted.json)" ]; then
              git add posted.json
              git commit -q -m "Record Telegram post"
              git pull --rebase -q && git push -q || echo "push failed - will retry"
            fi
          }
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            code=0; python3 run_slot.py || code=$?; remember; exit $code
          fi
          # GitHub's free timer skips most runs, so a run that does start STAYS AWAKE
          # for up to ~5h45m and checks every 5 min, posting the moment a slot is due
          # (9 AM view, 6 PM education). posted.json stops anything being sent twice.
          end=$(( $(date +%s) + 345*60 ))
          while [ $(date +%s) -lt $end ]; do
            git pull --rebase -q || true
            python3 run_slot.py || echo "slot failed - retrying in 5 min"
            remember
            sleep 300
          done
